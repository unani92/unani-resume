<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink-2);padding:28px 32px;}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:12px;}
  .tag{font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);width:96px;flex:none;}
  p{margin:0;max-width:440px;}
</style>
</head>
<body>
  <div class="row"><span class="tag">Body LG · 18</span><p style="font-size:18px;line-height:1.7;color:var(--ink);">안정적인 시스템을 설계하고, 복잡함을 단순하게 만드는 일을 좋아합니다.</p></div>
  <div class="row"><span class="tag">Body · 16</span><p style="font-size:16px;line-height:1.7;">결제 정산 배치를 재설계해 처리 시간을 단축하고 운영 부담을 줄였습니다. Backend engineer.</p></div>
  <div class="row"><span class="tag">Body SM · 14</span><p style="font-size:14px;line-height:1.6;color:var(--ink-3);">서울 기반 · 백엔드 4년 · 분산 시스템과 결제 도메인에 관심이 많습니다.</p></div>
  <div class="row"><span class="tag">Caption · 13</span><p style="font-size:13px;line-height:1.5;color:var(--ink-3);font-weight:500;">최근 업데이트 · 2025.11</p></div>
</body>
</html>
