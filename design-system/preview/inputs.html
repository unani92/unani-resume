<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:24px 30px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
  input,textarea{width:100%;box-sizing:border-box;font-family:var(--font-sans);font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;outline:none;}
  input::placeholder{color:var(--ink-4);}
  .focus{border-color:var(--accent);box-shadow:var(--shadow-ring);}
  .hint{font-size:11px;color:var(--ink-4);margin-top:5px;font-family:var(--font-mono,monospace);}
</style>
</head>
<body>
  <div class="grid">
    <div><label>이름</label><input value="정윤환"></div>
    <div><label>이메일</label><input class="focus" placeholder="you@example.com"><div class="hint">: focused</div></div>
    <div><label>역할</label><input value="백엔드 엔지니어"></div>
    <div><label>비활성</label><input value="읽기 전용" disabled style="background:var(--surface-2);color:var(--ink-4)"></div>
  </div>
</body>
</html>
