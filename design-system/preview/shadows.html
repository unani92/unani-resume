<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono,monospace);color:var(--ink-3);padding:30px 28px;}
  .row{display:flex;gap:26px;align-items:center;justify-content:space-around;}
  .item{text-align:center;}
  .box{width:96px;height:64px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);}
  .lab{font-size:11px;margin-top:14px;}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lab">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-ring)"></div><div class="lab">focus ring</div></div>
  </div>
</body>
</html>
