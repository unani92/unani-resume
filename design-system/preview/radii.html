<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono,monospace);color:var(--ink-2);padding:24px 28px;}
  .row{display:flex;gap:18px;align-items:flex-end;}
  .item{text-align:center;}
  .box{width:84px;height:64px;background:var(--surface);border:1.5px solid var(--accent-line);}
  .lab{font-size:11px;margin-top:8px;color:var(--ink-3);}
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--r-xs)"></div><div class="lab">xs · 6</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-sm)"></div><div class="lab">sm · 10</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-md)"></div><div class="lab">md · 14</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-lg)"></div><div class="lab">lg · 20</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-xl)"></div><div class="lab">xl · 28</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-pill);width:64px"></div><div class="lab">pill</div></div>
  </div>
</body>
</html>
