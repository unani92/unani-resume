<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{background:var(--paper-sunk);font-family:var(--font-sans);color:var(--ink);padding:26px 30px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:22px 24px;max-width:560px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;}
  .over{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);}
  .date{font-family:var(--font-mono);font-size:12px;color:var(--ink-4);}
  h3{margin:10px 0 2px;font-size:21px;font-weight:700;letter-spacing:-0.01em;}
  .role{font-family:var(--font-mono);font-size:13px;color:var(--accent);margin-bottom:12px;}
  p{margin:0;font-size:14px;line-height:1.65;color:var(--ink-2);}
  .num{color:var(--accent);font-weight:700;}
</style>
</head>
<body>
  <div class="card">
    <div class="top"><span class="over">Experience</span><span class="date">2021 — 2024</span></div>
    <h3>토스페이먼츠</h3>
    <div class="role">Backend Engineer · 결제 정산</div>
    <p>대규모 정산 배치를 재설계해 처리 시간을 <span class="num">1.2s → 0.3s</span>로 단축하고, 운영 알림 노이즈를 <span class="num">40%</span> 줄였습니다.</p>
  </div>
</body>
</html>
