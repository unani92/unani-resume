<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:26px 32px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 24px;}
  .cell .w{font-family:var(--font-mono,monospace);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:2px;}
  .cell .s{font-size:26px;line-height:1.1;}
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="w">Thin 100</div><div class="s" style="font-weight:100">정윤환 Aa</div></div>
    <div class="cell"><div class="w">Light 300</div><div class="s" style="font-weight:300">정윤환 Aa</div></div>
    <div class="cell"><div class="w">Regular 400</div><div class="s" style="font-weight:400">정윤환 Aa</div></div>
    <div class="cell"><div class="w">Medium 500</div><div class="s" style="font-weight:500">정윤환 Aa</div></div>
    <div class="cell"><div class="w">SemiBold 600</div><div class="s" style="font-weight:600">정윤환 Aa</div></div>
    <div class="cell"><div class="w">Bold 700</div><div class="s" style="font-weight:700">정윤환 Aa</div></div>
    <div class="cell"><div class="w">ExtraBold 800</div><div class="s" style="font-weight:800">정윤환 Aa</div></div>
    <div class="cell"><div class="w">Black 900</div><div class="s" style="font-weight:900">정윤환 Aa</div></div>
    <div class="cell"><div class="w">Pretendard</div><div class="s" style="font-weight:600;color:var(--accent)">가나다 123</div></div>
  </div>
</body>
</html>
