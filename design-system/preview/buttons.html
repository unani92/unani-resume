<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:28px 30px;}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  button{font-family:var(--font-sans);font-size:15px;font-weight:600;border-radius:var(--r-sm);padding:11px 20px;cursor:pointer;border:1px solid transparent;transition:all var(--dur) var(--ease);}
  .primary{background:var(--accent);color:var(--on-accent);}
  .primary:hover{background:var(--accent-hover);}
  .secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong);}
  .ghost{background:transparent;color:var(--ink-2);}
  .small{font-size:13px;padding:7px 14px;}
  .lab{font-family:var(--font-mono,monospace);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);width:64px;}
</style>
</head>
<body>
  <div class="row"><span class="lab">Default</span>
    <button class="primary">이력서 PDF</button>
    <button class="secondary">깃허브</button>
    <button class="ghost">연락하기 →</button>
  </div>
  <div class="row"><span class="lab">Pressed</span>
    <button class="primary" style="background:var(--accent-ink);transform:translateY(1px)">이력서 PDF</button>
    <button class="secondary" style="background:var(--surface-2)">깃허브</button>
    <button class="small primary">작게</button>
  </div>
</body>
</html>
