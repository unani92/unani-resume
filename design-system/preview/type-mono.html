<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:30px 32px;}
  .over{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .rule{height:2px;background:var(--line-ink);width:44px;margin:10px 0 18px;}
  .meta{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);display:flex;gap:18px;flex-wrap:wrap;}
  .meta b{color:var(--accent);font-weight:600;}
  code{font-family:var(--font-mono);}
</style>
</head>
<body>
  <div class="over">Experience / 2021 — Now</div>
  <div class="rule"></div>
  <div class="meta">
    <span>STACK · <b>TypeScript</b></span>
    <span>1.2s <b>→</b> 0.3s</span>
    <span>SEOUL · BACKEND</span>
  </div>
  <p style="margin:16px 0 0;font-size:14px;color:var(--ink-3);line-height:1.6;">The mono voice — eyebrows, date ranges, stacks, and one <code>important()</code> number.</p>
</body>
</html>
