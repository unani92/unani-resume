<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:28px 32px;}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:6px;}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);width:78px;flex:none;}
</style>
</head>
<body>
  <div class="row"><span class="tag">Display</span><span style="font-weight:900;font-size:56px;letter-spacing:-0.035em;line-height:1;">정윤환</span></div>
  <div class="row"><span class="tag">H1 · 800</span><span style="font-weight:800;font-size:38px;letter-spacing:-0.02em;">개발자 이력서</span></div>
  <div class="row"><span class="tag">H2 · 700</span><span style="font-weight:700;font-size:28px;letter-spacing:-0.015em;">프로젝트 소개</span></div>
  <div class="row"><span class="tag">H3 · 700</span><span style="font-weight:700;font-size:22px;">경력 기술서</span></div>
</body>
</html>
