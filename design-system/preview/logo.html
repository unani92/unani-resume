<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);color:var(--ink);padding:30px 32px;display:flex;align-items:center;gap:44px;}
  .mono-mark{width:72px;height:72px;border-radius:var(--r-md);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:26px;letter-spacing:.02em;}
  .word{font-weight:800;font-size:36px;letter-spacing:-0.02em;}
  .tag{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;}
  .dot{color:var(--accent);}
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
    <div class="mono-mark">YH</div>
    <div class="tag" style="letter-spacing:.1em">monogram</div>
  </div>
  <div>
    <div class="word">정윤환<span class="dot">.</span></div>
    <div class="tag">Jeong Yunhwan · Developer</div>
  </div>
</body>
</html>
