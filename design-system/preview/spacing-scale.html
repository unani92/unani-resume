<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono,monospace);color:var(--ink-2);padding:26px 30px;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px;}
  .bar{height:14px;background:var(--accent);border-radius:3px;}
  .lab{width:96px;font-size:11px;color:var(--ink-3);flex:none;}
</style>
</head>
<body>
  <div class="row"><span class="lab">s-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lab">s-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lab">s-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lab">s-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lab">s-5 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lab">s-6 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lab">s-7 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lab">s-8 · 64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="lab">s-9 · 96</span><div class="bar" style="width:96px"></div></div>
</body>
</html>
