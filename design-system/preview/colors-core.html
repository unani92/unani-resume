<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-mono,monospace);color:var(--ink);padding:24px 28px;}
  .row{display:flex;gap:14px;}
  .sw{flex:1;}
  .chip{height:64px;border-radius:var(--r-sm);border:1px solid rgba(42,36,32,.08);}
  .nm{font-size:11px;margin-top:8px;color:var(--ink-2);}
  .hx{font-size:10px;color:var(--ink-4);}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="nm">paper</div><div class="hx">#FAF6EF</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-sunk)"></div><div class="nm">paper-sunk</div><div class="hx">#F2ECE0</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="nm">surface</div><div class="hx">#FFFDF9</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-4)"></div><div class="nm">ink-4</div><div class="hx">#A99E94</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="nm">ink-3</div><div class="hx">#7C726A</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="nm">ink-2</div><div class="hx">#574E47</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="nm">ink</div><div class="hx">#2A2420</div></div>
  </div>
</body>
</html>
