<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정윤환 · 이력서</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;background:var(--paper-sunk);}
  *{box-sizing:border-box;}
  ::selection{background:var(--accent-soft);color:var(--accent-ink);}
  .toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:12px clamp(16px,5vw,40px);background:color-mix(in srgb,var(--paper) 80%,transparent);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .tbtn{display:inline-flex;align-items:center;gap:7px;font:600 13px/1 var(--font-sans);cursor:pointer;
    padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}
  .tbtn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;}
  .sheet{background:var(--surface);max-width:880px;margin:28px auto 56px;padding:48px clamp(28px,5vw,56px) 52px;
    border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-md);}
  .body-grid{display:grid;grid-template-columns:1fr 256px;gap:clamp(28px,5vw,52px);margin-top:8px;}
  @media print{.toolbar{display:none}.sheet{box-shadow:none;border:none;margin:0;max-width:none}body{background:#fff}}
</style>
</head>
<body>
<div class="toolbar">
  <span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);">Résumé · 정윤환</span>
  <div style="display:flex;gap:10px;">
    <button class="tbtn" onclick="window.print()"><i data-lucide="printer" style="width:14px;height:14px"></i>인쇄</button>
    <button class="tbtn primary"><i data-lucide="download" style="width:14px;height:14px"></i>PDF 저장</button>
  </div>
</div>
<div id="root"></div>
<script type="text/babel" src="ResumeHeader.jsx"></script>
<script type="text/babel" src="Section.jsx"></script>
<script type="text/babel" src="Experience.jsx"></script>
<script type="text/babel" src="SideRail.jsx"></script>
<script type="text/babel">
  function Resume() {
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    return (
      <div className="sheet">
        <RsHeader />
        <div className="body-grid">
          <div>
            <RsSection label="Experience" sub="6 yrs">
              <RsExperience />
            </RsSection>
          </div>
          <div>
            <RsSideRail />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Resume />);
</script>
</body>
</html>
