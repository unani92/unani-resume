<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정윤환 · 경력기술서</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;background:var(--paper-sunk);}
  *{box-sizing:border-box;}
  ::selection{background:var(--accent-soft);color:var(--accent-ink);}
  .toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:12px clamp(16px,5vw,40px);background:color-mix(in srgb,var(--paper) 80%,transparent);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .tbtn{display:inline-flex;align-items:center;gap:7px;font:600 13px/1 var(--font-sans);cursor:pointer;
    padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}
  .tbtn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;}
  .sheet{background:var(--surface);max-width:900px;margin:28px auto 56px;padding:48px clamp(28px,5vw,60px) 52px;
    border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-md);}
  @media print{.toolbar{display:none}.sheet{box-shadow:none;border:none;margin:0;max-width:none}body{background:#fff}article{break-inside:avoid}}
</style>
</head>
<body>
<div class="toolbar">
  <span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);">경력기술서 · 정윤환</span>
  <div style="display:flex;gap:10px;">
    <button class="tbtn" onclick="window.print()"><i data-lucide="printer" style="width:14px;height:14px"></i>인쇄</button>
    <button class="tbtn primary"><i data-lucide="download" style="width:14px;height:14px"></i>PDF 저장</button>
  </div>
</div>
<div id="root"></div>
<script type="text/babel" src="CareerHeader.jsx"></script>
<script type="text/babel" src="Project.jsx"></script>
<script type="text/babel">
  const PROJECTS = [
    {
      title: '정산 배치 엔진 재설계',
      period: '2023.05 — 2024.02', org: '토스페이먼츠', role: 'Backend Engineer', team: '결제정산팀 (5인)',
      summary: '일 단위 대량 정산 배치를 스트리밍 구조로 재설계해 처리 시간과 운영 부담을 동시에 줄였습니다.',
      stack: ['Kotlin', 'Spring Batch', 'Kafka', 'PostgreSQL', 'Redis'],
      problem: [
        '가맹점 증가로 일일 정산 데이터가 3배 늘며 배치가 마감 시간을 초과하기 시작',
        '단일 트랜잭션 기반 구조라 중간 실패 시 전체 재처리가 필요해 운영 리스크가 컸음',
      ],
      approach: [
        '정산 단계를 <b>읽기 → 집계 → 검증 → 적재</b>로 분리하고 Kafka 기반 스트리밍 파이프라인으로 재구성',
        '멱등 키(idempotency key)를 도입해 부분 실패 지점부터 재처리가 가능하도록 설계',
        '집계 쿼리를 윈도우 함수로 최적화하고 Redis 캐시로 중복 조회를 제거',
      ],
      results: [
        { metric: '1.2s → 0.3s', label: '건당 처리 시간' },
        { metric: '−75%', label: '배치 총 소요' },
        { metric: '주 8h → 1h', label: '수기 점검 시간' },
      ],
    },
    {
      title: '사내 API 게이트웨이 통합',
      period: '2021.02 — 2022.12', org: '카카오', role: 'Software Engineer', team: 'API 플랫폼팀 (7인)',
      summary: '12개 서비스에 흩어진 인증·레이트리밋을 단일 게이트웨이로 통합해 운영 일관성을 확보했습니다.',
      stack: ['Go', 'gRPC', 'Redis', 'Kubernetes', 'OpenTelemetry'],
      problem: [
        '서비스마다 인증 로직이 제각각이라 보안 정책 변경 시 12곳을 일일이 수정해야 했음',
        '레이트리밋 기준이 통일되지 않아 트래픽 급증 시 장애 대응이 늦어짐',
      ],
      approach: [
        '공통 인증·레이트리밋·로깅을 처리하는 Go 기반 게이트웨이를 설계하고 단계적으로 마이그레이션',
        'gRPC 인터셉터로 횡단 관심사를 표준화하고, OpenTelemetry로 분산 트레이싱을 도입',
        '점진적 롤아웃과 섀도 트래픽 비교로 무중단 전환을 보장',
      ],
      results: [
        { metric: '12 → 1', label: '인증 구현 지점' },
        { metric: '35m → 8m', label: '장애 추적 시간' },
        { metric: '−50%', label: '운영 공수' },
      ],
    },
  ];
  function Career() {
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    return (
      <div className="sheet">
        <CrHeader />
        {PROJECTS.map((p, i) => <CrProject key={i} p={p} index={i + 1} />)}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Career />);
</script>
</body>
</html>
